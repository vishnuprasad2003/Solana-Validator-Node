# Solana Private Cluster Configuration
# This file contains cluster-wide settings

# Cluster identification
CLUSTER_NAME="private-testnet"
CLUSTER_TYPE="development"

# Network configuration
GOSSIP_PORT=8001
RPC_PORT=8899
RPC_WEBSOCKET_PORT=8900
TPU_PORT=8003
TPU_FORWARD_PORT=8004
METRICS_PORT=9090

# Dynamic port range for validator services
# Note: Agave requires at least 25 ports in the range
DYNAMIC_PORT_RANGE_START=8000
DYNAMIC_PORT_RANGE_END=8025

# Bootstrap validator configuration
BOOTSTRAP_VALIDATOR_IP="127.0.0.1"
BOOTSTRAP_VALIDATOR_GOSSIP_PORT=8001

# Genesis configuration
GENESIS_LAMPORTS=1000000000000000
FAUCET_LAMPORTS=1000000000000000

# Validator configuration
VALIDATOR_MEMORY_LIMIT_MB=8192
VALIDATOR_ACCOUNT_INDEX=0
VALIDATOR_ACCOUNT_INDEX_INCLUDE_SIGNER=true

# Logging configuration
LOG_LEVEL="info"
LOG_DIR="${WORKSPACE_ROOT}/logs"
LOG_FILE_MAX_SIZE_MB=100
LOG_FILE_MAX_COUNT=10

# Data directories
LEDGER_BASE_DIR="${WORKSPACE_ROOT}/data"
BOOTSTRAP_LEDGER_DIR="${LEDGER_BASE_DIR}/bootstrap"
VALIDATOR_LEDGER_DIR="${LEDGER_BASE_DIR}/validator"

# Key directories
KEYS_BASE_DIR="${WORKSPACE_ROOT}/keys"
IDENTITY_KEY_DIR="${KEYS_BASE_DIR}/identity"
VOTE_KEY_DIR="${KEYS_BASE_DIR}/vote"
STAKE_KEY_DIR="${KEYS_BASE_DIR}/stake"

# Agave validator binary
AGAVE_BINARY_NAME="solana-validator"
AGAVE_VERSION="latest"
AGAVE_INSTALL_DIR="${WORKSPACE_ROOT}/bin"

# Performance tuning
ENABLE_ACCOUNTS_DB_CACHING=true
ACCOUNTS_DB_CACHE_SIZE_MB=2048
ENABLE_RPC_COMPRESSION=true
MAX_COMPLETED_TRANSACTIONS=65536
MAX_TRANSACTIONS_PER_ENTRY=12800

# Network tuning
MAX_NUM_BLOCKS_IN_FIFO_BLOCKSTORE=1000
MAX_NUM_SNAPSHOTS=8

# Enable metrics
ENABLE_METRICS=true
METRICS_HOST="0.0.0.0"

# Snapshot configuration
SNAPSHOT_INTERVAL_SLOTS=400
SNAPSHOT_COMPRESSION=true

# Account index configuration
ACCOUNT_INDEX_INCLUDE_KEY=false
ACCOUNT_INDEX_INCLUDE_OWNER=false
ACCOUNT_INDEX_INCLUDE_TOKEN_OWNER=false

# RPC configuration
RPC_BIND_ADDRESS="0.0.0.0"
RPC_MAX_MULTIPLE_ACCOUNTS=100
RPC_MAX_ACCOUNT_DATA_SIZE=10000000

# TPU configuration
TPU_ENABLE_UDP_FORWARDING=true
TPU_USE_QUIC=true

# Vote account configuration
VOTE_ACCOUNT_COMMISSION=10

# Staking configuration
MINIMUM_STAKE_LAMPORTS=1000000000
