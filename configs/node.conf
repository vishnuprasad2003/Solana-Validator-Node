# Solana Validator Node Configuration
# Copy this file for each node: configs/bootstrap.conf, configs/validator-1.conf

# ─────────────────────────────────────────────────────────────
# NODE IDENTITY
# ─────────────────────────────────────────────────────────────
NODE_NAME="bootstrap"
NODE_TYPE="bootstrap"  # "bootstrap" or "validator"

# ─────────────────────────────────────────────────────────────
# KEY PATHS (Azure File Share mounted at /solana)
# ─────────────────────────────────────────────────────────────
# All keys stored in Azure File Share for backup/persistence
IDENTITY_KEY="/solana/keys/${NODE_NAME}-identity.json"
VOTE_KEY="/solana/keys/${NODE_NAME}-vote.json"
STAKE_KEY="/solana/keys/${NODE_NAME}-stake.json"
FAUCET_KEY="/solana/keys/faucet.json"  # Bootstrap only

# ─────────────────────────────────────────────────────────────
# NETWORK PORTS (must be unique per node)
# ─────────────────────────────────────────────────────────────
GOSSIP_PORT=8001
RPC_PORT=8899
RPC_BIND_ADDRESS="0.0.0.0"
DYNAMIC_PORT_RANGE_START=8000
DYNAMIC_PORT_RANGE_END=8025

# ─────────────────────────────────────────────────────────────
# DATA PATHS (Azure File Share mounted at /solana)
# ─────────────────────────────────────────────────────────────
# All ledger data and logs stored in Azure File Share
LEDGER_DIR="/solana/data/${NODE_NAME}"
LOG_FILE="/solana/logs/${NODE_NAME}.log"

# ─────────────────────────────────────────────────────────────
# GENESIS (Bootstrap only)
# ─────────────────────────────────────────────────────────────
GENESIS_LAMPORTS=1000000000000000000  # 1 billion SOL
BOOTSTRAP_STAKE_LAMPORTS=1000000000000  # 1000 SOL staked to bootstrap validator
CLUSTER_TYPE="development"

# ─────────────────────────────────────────────────────────────
# CLUSTER CONNECTION (Validators only)
# ─────────────────────────────────────────────────────────────
ENTRYPOINT=""  # e.g., "localhost:8001" or "192.168.1.100:8001"
KNOWN_VALIDATOR=""  # Bootstrap identity pubkey
EXPECTED_GENESIS_HASH=""  # From bootstrap genesis

# ─────────────────────────────────────────────────────────────
# PERFORMANCE / STORAGE
# ─────────────────────────────────────────────────────────────
# LIMIT_LEDGER_SIZE: Shreds to keep (50M = ~2 days)
# Set to "unlimited", "0", or empty/comment out to disable limit
LIMIT_LEDGER_SIZE=50000000  # Set to "unlimited" or comment out for unlimited ledger size
