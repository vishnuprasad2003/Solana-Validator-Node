# Logrotate configuration for Solana Validator
# This file should be copied to /etc/logrotate.d/solana-validator
# Or use: sudo cp configs/logrotate-solana-validator.conf /etc/logrotate.d/solana-validator

/home/solana/Solana-Validator-Node/logs/validator.log {
    daily
    rotate 3
    compress
    delaycompress
    missingok
    notifempty
    create 0644 solana solana
    maxsize 50M
    copytruncate
}

/home/solana/Solana-Validator-Node/logs/*.log {
    weekly
    rotate 2
    compress
    delaycompress
    missingok
    notifempty
    create 0644 solana solana
    maxsize 10M
}

