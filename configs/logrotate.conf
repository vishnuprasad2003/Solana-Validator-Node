# Logrotate configuration for Solana validators
# This file is automatically generated and managed by the scripts

# Log directory
${LOG_DIR}/*.log {
    daily
    rotate ${LOG_FILE_MAX_COUNT:-10}
    compress
    delaycompress
    missingok
    notifempty
    create 0644 ${USER} ${USER}
    maxsize ${LOG_FILE_MAX_SIZE_MB:-100}M
    copytruncate
    sharedscripts
    postrotate
        # Optional: reload any log monitoring services
    endscript
}
