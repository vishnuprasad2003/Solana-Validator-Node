# ─────────────────────────────────────────────────────────────────────────────
# Solana Validator — Bootstrap Node
# ─────────────────────────────────────────────────────────────────────────────

# ─── BASE STORAGE ────────────────────────────────────────────────────────────
# All runtime data (ledger, logs, keys, pids, programs, backups) under BASE_DIR.
# Change this single variable to relocate everything.
BASE_DIR="/solana"

# ─── NODE IDENTITY ───────────────────────────────────────────────────────────
NODE_NAME="bootstrap"
NODE_TYPE="bootstrap"    # "bootstrap" or "validator"

# ─── NETWORK PORTS ───────────────────────────────────────────────────────────
GOSSIP_PORT=8001
RPC_PORT=8899
RPC_BIND_ADDRESS="0.0.0.0"
DYNAMIC_PORT_RANGE_START=8000
DYNAMIC_PORT_RANGE_END=8025

# ─── GENESIS (bootstrap only) ───────────────────────────────────────────────
GENESIS_LAMPORTS=1000000000000000000    # 1 billion SOL
BOOTSTRAP_STAKE_LAMPORTS=1000000000000  # 1 000 SOL staked
CLUSTER_TYPE="development"

# ─── CLUSTER CONNECTION (validators only — leave empty for bootstrap) ───────
ENTRYPOINT=""
KNOWN_VALIDATOR=""
EXPECTED_GENESIS_HASH=""

# ─── PERFORMANCE / STORAGE ──────────────────────────────────────────────────
# Shreds to keep. 50 000 000 ≈ 100-150 GB ≈ 2-3 days.
# Set to "unlimited" or "0" to disable pruning.
LIMIT_LEDGER_SIZE=50000000

# ─── DERIVED PATHS (all under BASE_DIR) ─────────────────────────────────────
IDENTITY_KEY="${BASE_DIR}/keys/${NODE_NAME}-identity.json"
VOTE_KEY="${BASE_DIR}/keys/${NODE_NAME}-vote.json"
STAKE_KEY="${BASE_DIR}/keys/${NODE_NAME}-stake.json"
FAUCET_KEY="${BASE_DIR}/keys/faucet.json"
LEDGER_DIR="${BASE_DIR}/data/${NODE_NAME}"
LOG_FILE="${BASE_DIR}/logs/${NODE_NAME}.log"
PID_FILE="${BASE_DIR}/pids/${NODE_NAME}.pid"
PROGRAMS_DIR="${BASE_DIR}/programs"
