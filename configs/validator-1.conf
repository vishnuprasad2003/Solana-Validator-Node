# Solana Validator Node Configuration
# Copy this file for each node: configs/bootstrap.conf, configs/validator-1.conf

# ─────────────────────────────────────────────────────────────
# NODE IDENTITY
# ─────────────────────────────────────────────────────────────
NODE_NAME="validator-1"
NODE_TYPE="validator"  # "bootstrap" or "validator"

# ─────────────────────────────────────────────────────────────
# KEY PATHS (relative to project root)
# ─────────────────────────────────────────────────────────────
IDENTITY_KEY="keys/${NODE_NAME}-identity.json"
VOTE_KEY="keys/${NODE_NAME}-vote.json"
STAKE_KEY="keys/${NODE_NAME}-stake.json"
FAUCET_KEY="keys/faucet.json"  # Bootstrap only

# ─────────────────────────────────────────────────────────────
# NETWORK PORTS (must be unique per node)
# ─────────────────────────────────────────────────────────────
GOSSIP_PORT=8026
RPC_PORT=8901
RPC_BIND_ADDRESS="0.0.0.0"
DYNAMIC_PORT_RANGE_START=8030
DYNAMIC_PORT_RANGE_END=8055

# ─────────────────────────────────────────────────────────────
# DATA PATHS
# ─────────────────────────────────────────────────────────────
LEDGER_DIR="data/${NODE_NAME}"
LOG_FILE="logs/${NODE_NAME}.log"

# ─────────────────────────────────────────────────────────────
# GENESIS (Bootstrap only)
# ─────────────────────────────────────────────────────────────
GENESIS_LAMPORTS=1000000000000000000  # 1 billion SOL
BOOTSTRAP_STAKE_LAMPORTS=1000000000000  # 1000 SOL staked to bootstrap validator
CLUSTER_TYPE="development"

# ─────────────────────────────────────────────────────────────
# CLUSTER CONNECTION (Validators only)
# ─────────────────────────────────────────────────────────────
ENTRYPOINT="localhost:8001"  # e.g., "localhost:8001" or "192.168.1.100:8001"
KNOWN_VALIDATOR="9R5uF5F35jhzzbwvr45GSE5Uu9DAWiTE3fmsP7XGDkp5"  # Bootstrap identity pubkey
EXPECTED_GENESIS_HASH="BgCCzadnyvZeuoxEDTDLwfqrd9P4oGFcaqk9iA2CyZzY"  # From bootstrap genesis

# ─────────────────────────────────────────────────────────────
# PERFORMANCE / STORAGE
# ─────────────────────────────────────────────────────────────
LIMIT_LEDGER_SIZE=50000000  # Shreds to keep (50M = ~2 days)
