apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: solana-bootstrap
  namespace: solana-cluster
spec:
  serviceName: solana-bootstrap
  replicas: 1
  selector:
    matchLabels:
      app: solana-bootstrap
  template:
    metadata:
      labels:
        app: solana-bootstrap
        role: bootstrap
    spec:
      securityContext:
        fsGroup: 1000
      containers:
      - name: validator
        image: solana-validator:latest  # Update with your registry: <registry>/solana-validator:latest
        imagePullPolicy: IfNotPresent
        command: ["/app/scripts/start-bootstrap.sh"]
        envFrom:
        - configMapRef:
            name: solana-config
        env:
        - name: NODE_NAME
          value: "bootstrap"
        - name: NODE_ROLE
          value: "bootstrap"
        - name: RPC_BIND_ADDRESS
          value: "0.0.0.0"
        - name: RUST_LOG
          value: "info"
        ports:
        - name: gossip
          containerPort: 8001
          protocol: UDP
        - name: gossip-tcp
          containerPort: 8001
          protocol: TCP
        - name: rpc
          containerPort: 8899
        - name: rpc-ws
          containerPort: 8900
        - name: metrics
          containerPort: 9090
        volumeMounts:
        - name: ledger
          mountPath: /app/data/bootstrap
        - name: keys
          mountPath: /app/keys
        - name: logs
          mountPath: /app/logs
        - name: config
          mountPath: /app/configs
        resources:
          requests:
            memory: "4Gi"
            cpu: "2"
          limits:
            memory: "16Gi"
            cpu: "8"
        securityContext:
          capabilities:
            add:
            - SYS_RESOURCE
      volumes:
      - name: config
        configMap:
          name: solana-config
      - name: ledger
        persistentVolumeClaim:
          claimName: bootstrap-ledger
      - name: keys
        persistentVolumeClaim:
          claimName: validator-keys
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: solana-bootstrap
  namespace: solana-cluster
spec:
  type: LoadBalancer  # Use NodePort for Azure VM, LoadBalancer for Azure AKS
  ports:
  - name: gossip-udp
    port: 8001
    protocol: UDP
    targetPort: 8001
  - name: gossip-tcp
    port: 8001
    protocol: TCP
    targetPort: 8001
  - name: rpc
    port: 8899
    targetPort: 8899
  - name: rpc-ws
    port: 8900
    targetPort: 8900
  - name: metrics
    port: 9090
    targetPort: 9090
  selector:
    app: solana-bootstrap
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bootstrap-ledger
  namespace: solana-cluster
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: validator-keys
  namespace: solana-cluster
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
